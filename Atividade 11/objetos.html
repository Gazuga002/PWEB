    function Aluno(ra,nome) {

    function Aluno2(){
        let ra;
        let nome;
        this.setRa = function(value) {
                this.ra = value;
        };
        this.getRa=function(){
            return this.ra;

        };
        this.setNome=function(value){
                this.nome = value;
        };
        this.getNome=function(){
            return this.nome;
    
        };
    }

    function AlunoADS(){
        let numLab;
        this.setnumLab = function(value){
            this.numLab = value;
        }
        this.getnumLab = function(){
            return this.numLab;
        }
    }
        AlunoADS.prototype= new Aluno2();

        class Aluno1{
            constructor(){
                this._ra;
                this._nome;
                
            }
            setNome(value){
                this._nome = value;
            }
            getNome(){
                return this._nome;
            }
            setRa(value){
                this._ra = value;
            }
            getRa(){
                return this._ra;
            }
        }
        var objAluno = new Aluno1();
        objAluno.setNome('Eduardo');
        objAluno.setRa('123');
        console.log(`Nome= ${objAluno.getNome()} Ra=${objAluno.getRa()}`);

        class AlunoADS1 extends Aluno1{
            constructor(){
                super();
                this._numLab;
            }
            setNumLab(value){
                this._numLab=value;
            }
            getnumLab(){
                return this._numLab;
            }
        }
        var objAlunoADS = new AlunoADS1();
        objAlunoADS.setNome("Caio Pinto");
        objAlunoADS.setRa("696969");
        objAlunoADS.setNumLab("6");
        console.log(`Nome= ${objAlunoADS.getNome()} ra=${objAlunoADS.getRa()} NumLab=${objAlunoADS.getnumLab()}`);

        var obj1 = new Object();

        console.log(obj2.nome);

    
        class ContaBancaria{
            #cpf; //Atributo privado

            constructor(nome,saldoInicial){
                    this.nome = nome;
                    this.saldo= saldoInicial;
            }

            setCpf(value){
                this.cpf =value;
            }
            getCpf(){
                return this.cpf;
            }
            getSaldo(){
                return this.saldoInicial;
            }
        
        depositar(valor){
            this.saldo +=valor;
            this.#registrarTransacao(valor); //metodo privado
        }

        #registrarTransacao(valor){
            console.log(`Depósito de R$ ${valor} realizado. 
            Saldo R$ ${this.saldo} para
            CPF ${this.getCpf()} ou ${this.#cpf}`);
        }

    }
    const conta = new ContaBancaria("Gustavo" , 1000);
    conta.setCpf(777);
    conta.depositar(50);
